# Project Chimera - GitHub Actions CI/CD
# Enterprise-grade pipeline like Google/Meta

name: Chimera CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.21"
  RUST_VERSION: "1.75"
  PYTHON_VERSION: "3.11"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # CODE QUALITY
  # ═══════════════════════════════════════════════════════════════
  
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: chat-server

  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Rust format
        run: cargo fmt --check
        working-directory: crypto-service
      
      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: crypto-service

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Ruff check
        run: ruff check ml-service scripts
      
      - name: Ruff format
        run: ruff format --check ml-service scripts

  # ═══════════════════════════════════════════════════════════════
  # SECURITY SCANNING
  # ═══════════════════════════════════════════════════════════════
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      
      - name: SAST with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go, python
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Go vulnerability check
        run: |
          cd chat-server
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      
      - name: Rust audit
        run: |
          cargo install cargo-audit
          cd crypto-service
          cargo audit
      
      - name: Python safety check
        run: |
          pip install safety
          cd ml-service
          safety check -r requirements.txt

  # ═══════════════════════════════════════════════════════════════
  # TESTING
  # ═══════════════════════════════════════════════════════════════
  
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    needs: lint-go
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Run tests
        run: |
          cd chat-server
          go test -v -race -coverprofile=coverage.out ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: chat-server/coverage.out
          flags: go

  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    needs: lint-rust
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Run tests
        run: |
          cd crypto-service
          cargo test --verbose

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd ml-service
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Run tests
        run: |
          cd ml-service
          pytest --cov=. --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ml-service/coverage.xml
          flags: python

  # ═══════════════════════════════════════════════════════════════
  # BUILD & PUSH
  # ═══════════════════════════════════════════════════════════════
  
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-go, test-rust, test-python, security-scan]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [chat-server, crypto-service, ml-service]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════
  # INTEGRATION TESTS
  # ═══════════════════════════════════════════════════════════════
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-images
    services:
      nats:
        image: nats:alpine
        ports:
          - 4222:4222
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Run integration tests
        run: |
          docker-compose -f docker-compose.yml up -d
          sleep 10
          ./scripts/integration_test.sh
          docker-compose down

  # ═══════════════════════════════════════════════════════════════
  # DEPLOY
  # ═══════════════════════════════════════════════════════════════
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to staging K8s
        run: |
          kubectl apply -f k8s/ --namespace chimera-staging
          kubectl rollout status deployment/chat-server -n chimera-staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Blue-Green Deploy
        run: |
          # Deploy to green
          kubectl apply -f k8s/ --namespace chimera-green
          kubectl rollout status deployment/chat-server -n chimera-green
          
          # Switch traffic
          kubectl patch service chimera-lb -p '{"spec":{"selector":{"version":"green"}}}'
          
          # Verify
          sleep 30
          curl -f http://chimera.internal/health
      
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "✅ Chimera deployed to production: ${{ github.sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
