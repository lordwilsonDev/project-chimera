events {
    worker_connections 10000;
}

http {
    upstream chat_servers {
        least_conn;
        server chat-server:8080 weight=1;
    }
    
    upstream crypto_server {
        server crypto-service:8081;
    }
    
    upstream ml_server {
        server ml-service:8082;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=5r/s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    server {
        listen 80;
        server_name localhost;

        access_log /var/log/nginx/access.log main;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # WebSocket endpoint
        location /ws {
            limit_req zone=ws burst=10 nodelay;
            
            proxy_pass http://chat_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Chat API
        location /api/chat/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://chat_servers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Crypto API
        location /api/crypto/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://crypto_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ML API
        location /api/ml/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ml_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            proxy_pass http://chat_servers/health;
        }

        # Metrics (protected)
        location /metrics {
            auth_basic "Metrics";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://chat_servers/metrics;
        }
    }
}
